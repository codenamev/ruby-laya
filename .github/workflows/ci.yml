name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        os: [ubuntu-latest]
        include:
          - ruby: "4.0"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # The whole suite, including real ONNX Runtime inference against the tiny checkpoint in
      # test/fixtures/tiny. No model downloads and no network.
      - run: bundle exec rake test

  pure:
    name: no ONNX Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      # Routing, language detection, email cleaning and the shortlist must work with neither
      # ONNX Runtime nor the tokenizers gem installed.
      - run: gem install minitest
      - run: |
          for file in test/parity_test.rb test/common_test.rb test/result_test.rb \
                      test/router_test.rb test/hub_test.rb test/shortlist_test.rb \
                      test/decision_test.rb test/py_json_test.rb; do
            ruby -Ilib -Itest "$file" || exit 1
          done

  lint:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop

  package:
    name: gem builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: gem build ruby-laya.gemspec
      - name: Version must match the tag on a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(ruby -Ilib -e 'require "laya/version"; print Laya::VERSION')
          test "$version" = "${GITHUB_REF_NAME#v}" || { echo "gem $version != tag ${GITHUB_REF_NAME#v}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: "*.gem"
